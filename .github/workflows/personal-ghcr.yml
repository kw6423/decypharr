name: Personal GHCR Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/decypharr

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set build metadata
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch_tag="${GITHUB_REF_NAME//\//-}"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=${branch_tag}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=personal-${{ env.SHORT_SHA }}
            CHANNEL=beta
          cache-from: type=gha,scope=personal-ghcr
          cache-to: type=gha,scope=personal-ghcr,mode=max
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.BRANCH_TAG }}
            ${{ env.IMAGE }}:${{ env.BRANCH_TAG }}-${{ env.SHORT_SHA }}
